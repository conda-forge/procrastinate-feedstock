schema_version: 1

context:
  version: "3.12.0"

package:
  name: procrastinate
  version: ${{ version }}

source:
  url: https://github.com/procrastinate-org/procrastinate/archive/refs/tags/${{ version }}.tar.gz
  sha256: 9e6f0cf69cb9213ba934adbbb6c0eab8bc3fb65e534f5c300f26e40422989531

build:
  number: 0
  noarch: python
  script:
    env:
      UV_DYNAMIC_VERSIONING_BYPASS: ${{ version }}
    content:
      - ${{ PYTHON }} -m pip install . -vv
  python:
    entry_points:
      - procrastinate = procrastinate.cli:main

requirements:
  host:
    - python ${{ python_min }}.*
    - hatchling
    - uv-dynamic-versioning
    - pip
  run:
    - python >=${{ python_min }}
    - psycopg
    - psycopg-pool
    - asgiref
    - attrs
    - croniter
    - python-dateutil
    - typing_extensions
    - packaging

tests:
  - python:
      imports:
        - procrastinate
      pip_check: true
      python_version:
        - '*'
        - ${{ python_min }}.*
  - requirements:
      run:
        - python ${{ python_min }}.*
    script:
      - procrastinate --help
  - requirements:
      run:
        - pytest
        - pytest-asyncio
        - pytest-mock
        - pytest-django
        - pytest-benchmark
        - pytest-cov
        - sphinx
        - django
    script:
      - if: win
        then: >
          pytest tests/unit
          --ignore=tests/unit/contrib
          --ignore=tests/unit/test_signals.py
          --deselect "tests/unit/test_worker.py::test_worker_run_respects_polling"
          --deselect "tests/unit/test_schema.py::test_get_migrations_path"
          --deselect "tests/unit/test_utils.py::test_get_module_name_path3"
          --deselect "tests/unit/test_worker.py::test_worker_run_wait_stop"
          --deselect "tests/unit/test_worker.py::test_worker_run_once_log_messages"
          --deselect "tests/unit/test_worker.py::test_run_no_signal_handlers"
        else: >
          pytest tests/unit
          --ignore=tests/unit/contrib
          --deselect "tests/unit/test_worker.py::test_worker_run_respects_polling"
          --deselect "tests/unit/test_schema.py::test_get_migrations_path"
    files:
      source:
        - tests/
        - pyproject.toml

about:
  summary: Postgres-based distributed task processing library
  license: MIT
  license_file: LICENSE.md
  homepage: https://procrastinate.readthedocs.io
  repository: https://github.com/procrastinate-org/procrastinate
  documentation: https://procrastinate.readthedocs.io

extra:
  recipe-maintainers:
    - jsmolic
